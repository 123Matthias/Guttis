<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Document</title>
</head>

<body>

    <header class="page-header">
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-chevron-left"></i>
        </a>
        <a href="index.html" class="logo">
            <picture>
                <source srcset="svg/logo-dark.svg" media="(prefers-color-scheme: dark)">
                <img src="svg/logo.svg" alt="Gutti's Hausmeisterservice">
            </picture>
        </a>
    </header>


    <div class="container py-5" style="margin-top: 100px;">

        <form id="contact-form" method="GET">
            <div class="mb-3">
                <label for="name" class="form-label">Dein Name:</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label">Betreff - Um Was gehts:</label>
                <input type="text" class="form-control" id="subject" name="subject" maxlength="15" required>
                <small class="form-text" style="color: var(--col-text); opacity: 0.7;">Maximal 15 Zeichen</small>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Nachricht:</label>
                <textarea class="form-control" id="message" name="message" rows="10" required></textarea>
            </div>

            <button type="submit" class="btn-mail-app">
                Mail-senden <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- Footer -->
    <footer id="footer">Schicke uns dein Anliegen oder Feedback</footer>

    <script>



        document.getElementById("contact-form").addEventListener("submit", function (event) {
            event.preventDefault(); // Verhindert, dass das Formular abgeschickt wird (Standardverhalten)

            // Werte aus den Formularfeldern holen
            var name = document.getElementById("name").value;
            var subject = document.getElementById("subject").value;
            var message = document.getElementById("message").value;

            // mailto-Link erstellen
            var mailtoLink = "mailto:danielguttenbrunner14@gmail.com"
                + "?subject=" + encodeURIComponent(subject)
                + "&body=" + encodeURIComponent("Hallo Gutti," + "\n\n" + message + "\n\n Beste Grüße,\n" + name);

            // Öffne den Standard-Mailclient des Nutzers mit dem vorab ausgefüllten Betreff und Text
            window.location.href = mailtoLink;
        });
    </script>

</body>

</html>
